<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script defer src="https://cloud.umami.is/script.js" data-website-id="d9bdbd8f-390d-4e4a-8cba-50ab9d0518ea"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — Ramy Wahib</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c1c1c;
    --bg-soft: #242424;
    --fg: #e8edf2;
    --fg-dim: #7c828a;
    --fg-dimmer: #3d4148;
    --rust: #f97316;
    --rust-bright: #fb923c;
    --rust-soft: rgba(249, 115, 22, 0.18);
    --rust-glow: rgba(249, 115, 22, 0.4);
    --line: rgba(220, 235, 245, 0.08);
    --card: rgba(30, 30, 30, 0.7);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(249, 115, 22, 0.06), transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(249, 115, 22, 0.04), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--rust); }

  .corner {
    position: fixed;
    width: 20px; height: 20px;
    border-color: var(--fg-dimmer);
    z-index: 3;
  }
  .corner.tl { top: 16px; left: 16px; border-top: 1px solid; border-left: 1px solid; }
  .corner.tr { top: 16px; right: 16px; border-top: 1px solid; border-right: 1px solid; }
  .corner.bl { bottom: 16px; left: 16px; border-bottom: 1px solid; border-left: 1px solid; }
  .corner.br { bottom: 16px; right: 16px; border-bottom: 1px solid; border-right: 1px solid; }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: 0.05em;
    background: rgba(28, 28, 28, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }

  nav .system-id { display: flex; align-items: center; gap: 10px; }

  nav .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--rust);
    box-shadow: 0 0 12px var(--rust-glow);
    animation: pulse 2s ease-in-out infinite;
  }

  nav a.back {
    color: var(--fg-dim);
    text-decoration: none;
    letter-spacing: 0.08em;
    transition: color 0.2s;
  }
  nav a.back:hover { color: var(--rust-bright); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 120px 32px 80px;
  }

  .page-eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--rust-bright);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .page-eyebrow::before { content: ''; width: 24px; height: 1px; background: var(--rust-bright); }

  .page-title {
    font-family: 'Russo One', sans-serif;
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 400;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 20px;
  }
  .page-title .accent { color: var(--rust-bright); text-shadow: 0 0 24px var(--rust-glow); }

  .page-sub {
    font-size: 14px;
    color: var(--fg-dim);
    line-height: 1.8;
    margin-bottom: 48px;
    max-width: 480px;
  }

  .divider {
    height: 1px;
    background: var(--line);
    margin-bottom: 48px;
  }

  .links-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px;
    margin-bottom: 48px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 24px 28px;
    border: 1px solid var(--line);
    background: var(--card);
    backdrop-filter: blur(10px);
    text-decoration: none;
    color: var(--fg);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
    position: relative;
  }

  .link-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--rust-soft), transparent);
    transition: left 0.5s ease;
  }

  .link-card:hover {
    border-color: var(--rust);
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(249, 115, 22, 0.15);
  }

  .link-card:hover::before { left: 100%; }

  .link-icon {
    width: 40px;
    height: 40px;
    border: 1px solid var(--line);
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--rust-bright);
    transition: border-color 0.3s;
  }

  .link-card:hover .link-icon { border-color: var(--rust); }

  .link-icon svg { width: 18px; height: 18px; }

  .link-info { flex: 1; min-width: 0; }

  .link-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--fg-dimmer);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .link-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .link-arrow {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: var(--rust-bright);
    transition: transform 0.3s;
  }

  .link-card:hover .link-arrow { transform: translateX(4px); }

  .form-block {
    border: 1px solid var(--line);
    background: var(--card);
    backdrop-filter: blur(10px);
    padding: 40px;
  }

  .form-label-section {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--rust-bright);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .form-label-section::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }

  .form-group.full { grid-column: 1 / -1; }

  label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--fg-dimmer);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  input, textarea {
    background: rgba(28, 28, 28, 0.8);
    border: 1px solid var(--line);
    color: var(--fg);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    padding: 12px 16px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, textarea:focus { border-color: var(--rust); }

  input::placeholder, textarea::placeholder {
    color: var(--fg-dimmer);
    font-size: 13px;
  }

  textarea { resize: vertical; min-height: 120px; }

  .submit-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    padding: 14px 32px;
    background: transparent;
    border: 1px solid var(--rust);
    color: var(--rust-bright);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .submit-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--rust-soft);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s;
  }

  .submit-btn:hover::before { transform: scaleX(1); }
  .submit-btn:hover { box-shadow: 0 0 20px rgba(249, 115, 22, 0.2); }

  .submit-btn span { position: relative; z-index: 1; }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 24px 32px 40px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--fg-dimmer);
    letter-spacing: 0.08em;
  }

  footer .blink {
    animation: blink 1.2s steps(2) infinite;
    color: var(--rust-bright);
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  @media (max-width: 600px) {
    .links-grid { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    main { padding: 100px 20px 60px; }
    .form-block { padding: 24px 20px; }
  }
</style>
</head>
<body>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<nav>
  <div class="system-id">
    <span class="dot"></span>
    <span>RW.SYS // REACH OUT</span>
  </div>
  <a href="index.html" class="back">← HOME</a>
</nav>

<main>
  <div class="page-eyebrow">03 · Reach Out</div>
  <h1 class="page-title">CON<span class="accent">TACT</span></h1>
  <p class="page-sub">Open to co-op roles in robotics, embedded systems, and autonomous systems. I build things that work — in software, hardware, and everything in between.</p>
  <div class="divider"></div>

  <div class="links-grid">
    <a href="https://www.linkedin.com/in/ramywahib/" target="_blank" rel="noopener" class="link-card">
      <div class="link-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
          <rect x="2" y="9" width="4" height="12"/>
          <circle cx="4" cy="4" r="2"/>
        </svg>
      </div>
      <div class="link-info">
        <div class="link-label">LinkedIn</div>
        <div class="link-name">ramy-wahib</div>
      </div>
      <span class="link-arrow">→</span>
    </a>

    <a href="https://github.com/ramywahib" target="_blank" rel="noopener" class="link-card">
      <div class="link-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
        </svg>
      </div>
      <div class="link-info">
        <div class="link-label">GitHub</div>
        <div class="link-name">ramywahib</div>
      </div>
      <span class="link-arrow">→</span>
    </a>

  </div>

  <div class="form-block">
    <div class="form-label-section">Send a Message</div>
    <form action="https://formspree.io/f/placeholder" method="POST">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required>
        </div>
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="Co-op Opportunity · Project Collab · Other">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Tell me about the role or what you're working on..." required></textarea>
      </div>
      <button type="submit" class="submit-btn">
        <span>SEND TRANSMISSION →</span>
      </button>
    </form>
  </div>
</main>

<footer>© 2026 · RAMYWAHIB.COM · READY<span class="blink">_</span></footer>

</body>
</html>
