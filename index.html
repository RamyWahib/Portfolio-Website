<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ramy Wahib — Engineering Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c1c1c;
    --bg-soft: #242424;
    --fg: #e8edf2;
    --fg-dim: #7c828a;
    --fg-dimmer: #3d4148;
    --rust: #f97316;
    --rust-bright: #fb923c;
    --rust-soft: rgba(249, 115, 22, 0.18);
    --rust-glow: rgba(249, 115, 22, 0.4);
    --grid: rgba(220, 235, 245, 0.035);
    --line: rgba(220, 235, 245, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(249, 115, 22, 0.06), transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(249, 115, 22, 0.04), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(249, 115, 22, 0.14), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 3px,
      rgba(220, 235, 245, 0.012) 3px,
      rgba(220, 235, 245, 0.012) 4px
    );
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: overlay;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: 0.05em;
    opacity: 0;
    animation: fadeIn 1s ease 0.2s forwards;
  }

  nav .system-id { display: flex; align-items: center; gap: 10px; }

  nav .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--rust);
    box-shadow: 0 0 12px var(--rust-glow);
    animation: pulse 2s ease-in-out infinite;
  }

  nav .timestamp { color: var(--fg-dimmer); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  .corner {
    position: fixed;
    width: 20px; height: 20px;
    border-color: var(--fg-dimmer);
    z-index: 3;
    opacity: 0;
    animation: fadeIn 1s ease 0.4s forwards;
  }
  .corner.tl { top: 16px; left: 16px; border-top: 1px solid; border-left: 1px solid; }
  .corner.tr { top: 16px; right: 16px; border-top: 1px solid; border-right: 1px solid; }
  .corner.bl { bottom: 16px; left: 16px; border-bottom: 1px solid; border-left: 1px solid; }
  .corner.br { bottom: 16px; right: 16px; border-bottom: 1px solid; border-right: 1px solid; }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    z-index: 2;
  }

  .connectors {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .connector-line {
    stroke: var(--line);
    stroke-width: 1;
    fill: none;
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    animation: drawLine 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .connector-line.l1 { animation-delay: 1.2s; }
  .connector-line.l2 { animation-delay: 1.4s; }
  .connector-line.l3 { animation-delay: 1.6s; }

  @keyframes drawLine { to { stroke-dashoffset: 0; } }

  .connector-pulse {
    fill: var(--rust-bright);
    opacity: 0;
    animation: travelPulse 3.5s ease-in-out infinite;
    filter: drop-shadow(0 0 4px var(--rust-glow));
  }

  .connector-pulse.p1 { animation-delay: 2.4s; }
  .connector-pulse.p2 { animation-delay: 2.9s; }
  .connector-pulse.p3 { animation-delay: 3.4s; }

  @keyframes travelPulse {
    0% { opacity: 0; offset-distance: 0%; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { opacity: 0; offset-distance: 100%; }
  }

  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    opacity: 0;
    animation: hubIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
  }

  @keyframes hubIn {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .portrait-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    margin-bottom: 28px;
  }

  .portrait-ring {
    position: absolute;
    inset: -16px;
    border: 1px dashed var(--line);
    border-radius: 50%;
    animation: spin 40s linear infinite;
  }

  .portrait-ring::before {
    content: '';
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 7px;
    height: 7px;
    background: var(--rust-bright);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--rust-glow);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .portrait {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--bg-soft);
    position: relative;
    box-shadow: 0 0 50px rgba(249, 115, 22, 0.25);
  }

  .portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .portrait .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #161a1f 0%, #0b0d10 100%);
    color: var(--fg-dim);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    flex-direction: column;
    gap: 6px;
  }

  .placeholder svg {
    width: 60px;
    height: 60px;
    opacity: 0.4;
  }

  .hub-name {
    font-family: 'Russo One', sans-serif;
    font-size: 42px;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    line-height: 1;
    text-transform: uppercase;
  }

  .hub-name .accent {
    font-family: 'Russo One', sans-serif;
    color: var(--rust-bright);
    font-weight: 400;
    text-shadow: 0 0 24px var(--rust-glow);
  }

  .hub-desc {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    max-width: 320px;
    line-height: 1.7;
  }

  .hub-desc .sep {
    color: var(--rust-bright);
    margin: 0 8px;
  }

  .branch {
    position: absolute;
    z-index: 5;
    opacity: 0;
  }

  /* UPSIDE-DOWN TRIANGLE: two buttons at top, one at bottom */
  .branch.b1 {
    /* top-left */
    top: 15%;
    left: 18%;
    animation: branchIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
  }

  .branch.b2 {
    /* top-right */
    top: 15%;
    right: 18%;
    animation: branchIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.0s forwards;
  }

  .branch.b3 {
    /* bottom-center (point of the inverted triangle) */
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    animation: branchInBottom 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards;
  }

  @keyframes branchIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes branchInBottom {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .branch-btn {
    display: block;
    text-decoration: none;
    color: var(--fg);
    cursor: pointer;
    position: relative;
  }

  .branch-node {
    position: relative;
    padding: 20px 32px;
    border: 1px solid var(--line);
    background: rgba(30, 30, 30, 0.6);
    /* backdrop-filter: blur(10px); */
    min-width: 220px;
    text-align: center;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
  }

  .branch-node::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--rust-soft), transparent);
    transition: left 0.6s ease;
  }

  .branch-btn:hover .branch-node {
    border-color: var(--rust);
    background: rgba(30, 30, 30, 0.9);
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(249, 115, 22, 0.2);
  }

  .branch-btn:hover .branch-node::before { left: 100%; }

  .branch-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--fg-dimmer);
    letter-spacing: 0.15em;
    margin-bottom: 6px;
  }

  .branch-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .branch-title .arrow {
    display: inline-block;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    color: var(--rust-bright);
  }

  .branch-btn:hover .branch-title .arrow { transform: translateX(4px); }

  footer {
    position: fixed;
    bottom: 24px;
    left: 32px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--fg-dimmer);
    letter-spacing: 0.08em;
    z-index: 3;
    opacity: 0;
    animation: fadeIn 1s ease 2.6s forwards;
    white-space: nowrap;
  }

  footer .blink {
    animation: blink 1.2s steps(2) infinite;
    color: var(--rust-bright);
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (max-width: 900px) {
    html, body { overflow-y: auto; height: auto; min-height: 100vh; }
    .stage { height: auto; min-height: 100vh; padding: 100px 20px 80px; }
    .connectors { display: none; }
    .hub {
      position: relative;
      top: auto;
      left: auto;
      transform: none;
      margin: 0 auto 48px;
      animation: fadeIn 0.8s ease 0.6s forwards;
    }
    .portrait-wrap { width: 140px; height: 140px; }
    .hub-name { font-size: 34px; }
    .branch {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      right: auto !important;
      bottom: auto !important;
      transform: none !important;
      margin: 0 auto 16px;
      width: 100%;
      max-width: 320px;
      animation-name: branchIn !important;
    }
    .branch-node { width: 100%; }
    footer { position: relative; bottom: auto; left: auto; margin: 20px auto 0; text-align: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="scanlines" style="display:none"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<nav>
  <div class="system-id">
    <span class="dot"></span>
    <span>RW.SYS // v2026.04</span>
  </div>
  <div class="timestamp" id="timestamp">—</div>
</nav>

<div class="stage">
  <svg class="connectors" id="connectors" preserveAspectRatio="none"></svg>

  <div class="hub">
    <div class="portrait-wrap">
      <div class="portrait-ring"></div>
      <div class="portrait">
        <img src="media/selfie.webp" alt="Ramy Wahib" />
      </div>
    </div>
    <div class="hub-name">RAMY <span class="accent">WAHIB</span></div>
    <div class="hub-desc">
      Mechatronics Eng<span class="sep">·</span>Waterloo<span class="sep">·</span>Building robots that think
    </div>
  </div>

  <div class="branch b1">
    <a href="experience.html" class="branch-btn">
      <div class="branch-node">
        <div class="branch-label">01 · CAREER</div>
        <div class="branch-title">Experience <span class="arrow">→</span></div>
      </div>
    </a>
  </div>

  <div class="branch b2">
    <a href="projects.html" class="branch-btn">
      <div class="branch-node">
        <div class="branch-label">02 · BUILDS</div>
        <div class="branch-title">Projects <span class="arrow">→</span></div>
      </div>
    </a>
  </div>

  <div class="branch b3">
    <a href="contact.html" class="branch-btn">
      <div class="branch-node">
        <div class="branch-label">03 · REACH OUT</div>
        <div class="branch-title">Contact <span class="arrow">→</span></div>
      </div>
    </a>
  </div>
</div>

<footer>
  © 2026 · RAMYWAHIB.COM · READY<span class="blink">_</span>
</footer>

<script>
  function updateTime() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    document.getElementById('timestamp').textContent =
      `${now.getUTCFullYear()}.${pad(now.getUTCMonth()+1)}.${pad(now.getUTCDate())} · ${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())} UTC`;
  }
  updateTime();
  setInterval(updateTime, 1000);

  function drawConnectors() {
    const svg = document.getElementById('connectors');
    const w = window.innerWidth;
    const h = window.innerHeight;
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);

    if (w <= 900) { svg.innerHTML = ''; return; }

    const hub = document.querySelector('.hub').getBoundingClientRect();
    const nodes = [
      document.querySelector('.b1 .branch-node').getBoundingClientRect(),
      document.querySelector('.b2 .branch-node').getBoundingClientRect(),
      document.querySelector('.b3 .branch-node').getBoundingClientRect()
    ];

    // Anchor lines to the bottom of the hub-name (where "RAMY WAHIB" ends)
    const nameEl = document.querySelector('.hub-name').getBoundingClientRect();
    const hubX = hub.left + hub.width / 2;
    const hubY = nameEl.bottom + 4;
    const hubRadius = 0; // start right at the name baseline

    let html = '';
    nodes.forEach((n, i) => {
      const nx = n.left + n.width / 2;
      const ny = n.top + n.height / 2;

      const dx = nx - hubX;
      const dy = ny - hubY;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const ux = dx / dist, uy = dy / dist;

      const sx = hubX;
      const sy = hubY;

      // where line meets node rectangle
      const halfW = n.width / 2 + 4;
      const halfH = n.height / 2 + 4;
      const tx = halfW / Math.abs(ux || 0.0001);
      const ty = halfH / Math.abs(uy || 0.0001);
      const t = Math.min(tx, ty);
      const ex = nx - ux * t;
      const ey = ny - uy * t;

      html += `
        <path class="connector-line l${i+1}" d="M ${sx} ${sy} L ${ex} ${ey}" />
        <circle class="connector-pulse p${i+1}" r="2.5" style="offset-path: path('M ${sx} ${sy} L ${ex} ${ey}');" />
      `;
    });
    svg.innerHTML = html;
  }

  requestAnimationFrame(() => setTimeout(drawConnectors, 50));
  window.addEventListener('resize', drawConnectors);
</script>

</body>
</html>
